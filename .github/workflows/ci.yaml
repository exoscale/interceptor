name: CI

on: [push, pull_request]

jobs:

  test:

    strategy:
      matrix:
        os: [ubuntu-latest] # macOS-latest, windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # It is important to install java before installing clojure tools which needs java
      # exclusions: babashka, clj-kondo and cljstyle
      - name: Prepare java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          lein: latest                 # Leiningen
          # bb: latest                   # Babashka

      - name: Setup bb from master
        run: |
          bash <(curl https://raw.githubusercontent.com/babashka/babashka/master/install) \
            --version 0.9.163-SNAPSHOT --dir /usr/local/bin

      # Optional step:
      - name: Cache clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # List all files containing dependencies:
          key: cljdeps-${{ hashFiles('project', 'bb.edn') }}
          restore-keys: cljdeps-

      - name: Test Clojure
        run: bb test:clj

      - name: Test Babashka
        run: bb test:bb
